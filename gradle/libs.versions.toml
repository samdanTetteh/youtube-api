[versions]
androidGradlePlugin = "8.13.1"
kotlinAndroid = "2.2.21"

kotlin = "2.2.21"
composeBom = "2025.11.00"
composeActivity = "1.11.0"
composeViewModel = "2.9.4"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
jetbrainsKotlinJvm = "2.2.21"
daggerHilt = "2.57.2"
hiltNavigation = "1.3.0"
navigation = "2.9.6"
ksp = "2.2.20-Beta1-2.0.2"
retrofit = "3.0.0"
okHttp3 = "5.3.0"
roomLibrary = "2.8.4"
coroutines = "1.10.2"
truth = "1.4.5"
mockito = "5.20.0"
mockK = "1.14.6"
roomCommonJvm = "2.8.3"
kotlinCoroutines = "1.10.2"
runner = "1.7.0"
material3WindowSizeClassAndroid = "1.4.0"
coilCompose = "3.3.0"
testRules = "1.7.0"
constraitLayout = "2.2.1"
legacy = "4:1.0.0"
deprecatedLifecycle = "2.2.0"
lifecycle = "2.10.0"
paging = "3.3.6"
moshi = "3.0.0"

[libraries]
# Deprecated
androidx-legacy-support = { group = "androidx.legacy", name = "legacy-support-v", version.ref = "legacy" }
androidx-lifecycle-extensions = { group = "androidx.lifecycle", name = "lifecycle-extensions", version.ref = "deprecatedLifecycle" }

# architecture components
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedate-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomLibrary" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomLibrary" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomLibrary" }
androidx.paging.runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }

# Navigation
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation" }
androidx-navigation-safe-args-gradle-plugin = { group = "androidx.navigation", name = "navigation-safe-args-gradle-plugin", version.ref = "navigation" }
androidx-fragment-navigation = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }

# Retrofit
squareup-retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
squareup-retrofit2-gson-converter = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
squareup-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okHttp3" }
squareup-retrofit2-moshi-converter = { group = "com.squareup.retrofit2", name="onverter-moshi", version.ref = "moshi" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okHttp3" }


# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }

# Material Design 3
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Android Studio Preview Support
androidx-compose-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# UI Tests
androidx-compose-ui-junit4-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-manifest-test = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Compose Activity
androidx-compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "composeActivity" }
# Compose ViewModel
androidx-compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "composeViewModel" }
# Compose liveDate
androidx-compose-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }

# DI
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "daggerHilt" }
android-hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "daggerHilt" }
android-hilt-test = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "daggerHilt" }

# Room
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "roomLibrary" }

# Lifecycle testing
androidx-lifecycle-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "lifecycle" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlin" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

google-truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "composeActivity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockK" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockK" }
androidx-room-common-jvm = { group = "androidx.room", name = "room-common-jvm", version.ref = "roomCommonJvm" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }

androidx-constraint-layout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraitLayout" }


# This was added with the assumption to show screens based on device screen size
androidx-material3-window-size-clazz-android = { group = "androidx.compose.material3", name = "material3-window-size-class-android", version.ref = "material3WindowSizeClassAndroid" }

# Image loader
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coilCompose" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coilCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinAndroid" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
android-hilt = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "androidGradlePlugin" }
safe-args-plugin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
